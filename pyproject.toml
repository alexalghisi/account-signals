[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "account-signals"
version = "0.1.0"
description = "Prioritise accounts for sales from ICP fit, buying signals and CRM notes"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.116", "pydantic>=2.8", "httpx>=0.27", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
account-signals = "account_signals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
account_signals = ["schema.sql", "report.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
